{% extends 'base.html' %}
{% block title %}Iniciar sesion - Family Calendar{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Family Calendar</h1>
      <p class="text-gray-400 mt-1">Ingresa a tu calendario familiar</p>
    </div>
    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800 shadow-xl">
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if form.errors %}
        <div class="mb-4 p-3 bg-red-900/30 border border-red-800 rounded-lg text-sm text-red-300">
          Usuario o contrasena incorrectos
        </div>
        {% endif %}
        <div class="space-y-4">
          <div>
            <label for="id_username" class="block text-sm font-medium text-gray-300 mb-1.5">Usuario</label>
            <input type="text" name="username" id="id_username" required
                   class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-colors"
                   placeholder="tu usuario">
          </div>
          <div>
            <label for="id_password" class="block text-sm font-medium text-gray-300 mb-1.5">Contrasena</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-colors"
                   placeholder="tu contrasena">
          </div>
          <button type="submit"
                  class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-gray-900">
            Iniciar sesion
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
