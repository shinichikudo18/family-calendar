{% extends 'base.html' %}
{% block title %}Inicio - Family Calendar{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-bold text-white">Bienvenido, {{ user.first_name|default:user.username }}</h1>
      <p class="text-gray-400 mt-1">{% now "l, j \d\e F \d\e Y" %}</p>
    </div>
    <a href="#" onclick="document.getElementById('newEventModal').classList.remove('hidden')"
       class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg transition-colors text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nuevo evento
    </a>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
      <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
        Hoy
      </h2>
      <div id="today-events" hx-get="{% url 'dashboard' %}?partial=today" hx-trigger="load" hx-target="#today-events" hx-swap="innerHTML">
        <div class="flex items-center gap-2 text-gray-500 text-sm py-8 justify-center">
          <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Cargando...
        </div>
      </div>
    </div>

    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
      <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-brand-400"></span>
        Proximos
      </h2>
      <div id="upcoming-events" hx-get="{% url 'dashboard' %}?partial=upcoming" hx-trigger="load" hx-target="#upcoming-events" hx-swap="innerHTML">
        <div class="flex items-center gap-2 text-gray-500 text-sm py-8 justify-center">
          <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Cargando...
        </div>
      </div>
    </div>
  </div>
</div>

<div id="newEventModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-black/60" onclick="this.parentElement.classList.add('hidden')"></div>
  <div class="relative bg-gray-900 rounded-2xl border border-gray-800 p-6 w-full max-w-lg shadow-2xl">
    <h2 class="text-lg font-semibold text-white mb-4">Nuevo evento</h2>
    <form hx-post="{% url 'event_create_htmx' %}" hx-target="#newEventModal" hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('newEventModal').classList.add('hidden'); htmx.trigger('#today-events', 'load'); htmx.trigger('#upcoming-events', 'load'); }">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Titulo</label>
          <input type="text" name="title" required
                 class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Inicio</label>
            <input type="datetime-local" name="start_time" required
                   class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Fin</label>
            <input type="datetime-local" name="end_time" required
                   class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Descripcion</label>
          <textarea name="description" rows="2"
                    class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="this.closest('#newEventModal').classList.add('hidden')"
                  class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">Cancelar</button>
          <button type="submit"
                  class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition-colors">Crear</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
