<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Family Calendar{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81', 950: '#1e1b4b' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-950 text-gray-100" hx-ext="response-targets">
  {% if user.is_authenticated %}
  <div class="flex h-full">
    {% include 'web/sidebar.html' %}
    <main class="flex-1 overflow-auto">
      <div class="px-6 py-6">
        {% if messages %}
        <div class="mb-4 space-y-2">
          {% for msg in messages %}
          <div class="px-4 py-3 rounded-lg text-sm font-medium
            {% if msg.tags == 'error' %}bg-red-900/50 text-red-200 border border-red-700
            {% elif msg.tags == 'success' %}bg-green-900/50 text-green-200 border border-green-700
            {% else %}bg-blue-900/50 text-blue-200 border border-blue-700{% endif %}"
            role="alert">
            {{ msg }}
          </div>
          {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% else %}
  <div class="h-full">
    {% block auth_content %}{% endblock %}
  </div>
  {% endif %}
</body>
</html>
