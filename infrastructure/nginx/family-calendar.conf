# Family Calendar - Virtual Host para Nginx externo
# Copiar a /etc/nginx/sites-available/ y habilitar
# server_name: calendar.tudominio.com

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

upstream calendar_backend {
    server 192.168.22.51:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name calendar.tudominio.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name calendar.tudominio.com;

    ssl_certificate /etc/ssl/certs/calendar.tudominio.com.pem;
    ssl_certificate_key /etc/ssl/private/calendar.tudominio.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy to Gunicorn
    location / {
        proxy_pass http://calendar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;

        # Rate limiting for general API
        limit_req zone=api burst=50 nodelay;
    }

    # Rate limiting for login
    location /api/v1/auth/ {
        proxy_pass http://calendar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=login burst=5 nodelay;
    }

    # Block internal routes
    location /admin/ {
        proxy_pass http://calendar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # Health check (no auth)
    location /api/v1/integrations/health/ {
        proxy_pass http://calendar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # Static files
    location /static/ {
        alias /opt/family-calendar/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/family-calendar-access.log;
    error_log /var/log/nginx/family-calendar-error.log;
}
